version: "3.8"

services:
  sync_server:
    build:
      context: ..
      dockerfile: sync_server/Dockerfile
    container_name: ghostbrowser-sync-server
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # REQUIRED: set this in a .env file or via docker-compose override.
      GHOSTBROWSER_SYNC_MASTER_TOKEN: ${GHOSTBROWSER_SYNC_MASTER_TOKEN:?GHOSTBROWSER_SYNC_MASTER_TOKEN is required}
      # Optional: persist archives to an SQLite database inside the volume.
      GHOSTBROWSER_SYNC_DATABASE: ${GHOSTBROWSER_SYNC_DATABASE:-/data/sync.db}
      # Optional: change archive size limit (default is 100 MiB).
      GHOSTBROWSER_SYNC_MAX_ARCHIVE_BYTES: ${GHOSTBROWSER_SYNC_MAX_ARCHIVE_BYTES:-104857600}
      # Required outside development: HMAC salt used for device key derivation.
      GHOSTBROWSER_SYNC_HMAC_SALT: ${GHOSTBROWSER_SYNC_HMAC_SALT:-}
    volumes:
      - sync_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  sync_data:
    driver: local
