name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify clean checkout
        shell: pwsh
        run: |
          git diff --check
          if (git status --porcelain) {
            Write-Error "Working tree is dirty or contains untracked candidate files."
            exit 1
          }

      - name: Credential pattern scan
        run: python scripts/check_credentials.py

      - name: Release audit
        run: python scripts/release_audit.py --skip-dist

      - name: Pytest
        run: python -m pytest -q --timeout=60

      - name: Unittest discovery
        run: python -m unittest discover -s tests -v
